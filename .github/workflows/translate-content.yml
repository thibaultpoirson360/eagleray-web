name: Translate content (DeepL draft)

# MANUAL FALLBACK ONLY. Spanish and French are normally drafted by the
# assistant: a person runs /translate in Claude Code after a batch of editor
# changes and reviews the resulting pull request (see
# docs/translation-workflow.md). This workflow used to run on every push to
# main that touched English content, and re-translated every changed file with
# DeepL on every save. That trigger is gone; nothing runs automatically.
#
# Run it by hand (Actions > Run workflow) only if /translate is not an option.
# It uses the DeepL API (DEEPL_API_KEY secret) and COMMITS DIRECTLY TO main
# with no review. Scope "missing" only creates files that do not exist yet.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          What to translate. "changed" = only files changed by the last commit.
          "missing" = every EN document, but ONLY the ES/FR files that don't
          exist yet (never touches an existing/reviewed translation).
          "all" = every EN document, overwriting every existing ES/FR file.
        type: choice
        options: [changed, missing, all]
        default: missing

permissions:
  contents: write

# Two runs must not push to main at the same time.
concurrency:
  group: translate-content
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: scripts/translate-content.mjs diffs
          # $GIT_BASE_SHA...$GIT_HEAD_SHA itself, which needs both commits
          # present locally. A shallow checkout would make that diff fail
          # on every run — the script falls back to a full content rescan
          # if it does, but that means re-translating everything, not just
          # what changed, so a full checkout is worth the extra fetch time
          # on a repo this size.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm ci` / dependency install step, on purpose: the translation
      # script (scripts/translate-content.mjs + scripts/lib/*) uses only
      # Node built-ins (`fetch`, `node:fs`, `node:path`, `node:child_process`,
      # `node:module`) and Node's own `--experimental-strip-types` to read
      # tina/collections/*.ts directly — zero npm dependencies, so nothing
      # to install. (astro build/tinacms build steps are NOT part of this
      # job; the opened PR's preview build handles that — see the "Preview
      # deployment" section of docs/translation-workflow.md.)

      - name: Draft ES/FR translations with DeepL
        id: translate
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          # "changed" compares the last commit (HEAD^...HEAD); the script falls
          # back to a full rescan if that diff is not possible.
          GIT_BASE_SHA: ''
          GIT_HEAD_SHA: ${{ github.sha }}
          TRANSLATE_SCOPE: ${{ inputs.scope }}
        run: node --experimental-strip-types scripts/translate-content.mjs

      - name: Commit the draft translations straight to main
        if: steps.translate.outputs.files_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Translate content to ES/FR (DeepL draft)"
          # Someone may have pushed while DeepL was running.
          git pull --rebase origin main
          git push origin HEAD:main
