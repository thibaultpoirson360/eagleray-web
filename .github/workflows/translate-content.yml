name: Translate content (DeepL draft)

# Trigger: a push to main that touches EN source content —
# content/<collection>/en.json (one-doc-per-locale sections, e.g. hero,
# funnel) or content/<collection>/en/<slug>.json (multi-doc collections,
# e.g. crew, boats, blogPost) — see docs/translation-workflow.md for how
# this path was confirmed against the actual Tina schema/content layout,
# not assumed. workflow_dispatch is a manual escape hatch (e.g. to re-run
# after adding/fixing the DEEPL_API_KEY secret).
#
# This workflow only ever OPENS a pull request with the drafted ES/FR
# translations — nothing here merges anything. See docs/translation-workflow.md
# for the full trigger -> translate -> PR -> review -> merge flow.
on:
  push:
    branches: [main]
    paths:
      - "content/**/en.json"
      - "content/**/en/*.json"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: scripts/translate-content.mjs diffs
          # $GIT_BASE_SHA...$GIT_HEAD_SHA itself, which needs both commits
          # present locally. A shallow checkout would make that diff fail
          # on every run — the script falls back to a full content rescan
          # if it does, but that means re-translating everything, not just
          # what changed, so a full checkout is worth the extra fetch time
          # on a repo this size.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm ci` / dependency install step, on purpose: the translation
      # script (scripts/translate-content.mjs + scripts/lib/*) uses only
      # Node built-ins (`fetch`, `node:fs`, `node:path`, `node:child_process`,
      # `node:module`) and Node's own `--experimental-strip-types` to read
      # tina/collections/*.ts directly — zero npm dependencies, so nothing
      # to install. (astro build/tinacms build steps are NOT part of this
      # job; the opened PR's preview build handles that — see the "Preview
      # deployment" section of docs/translation-workflow.md.)

      - name: Draft ES/FR translations with DeepL
        id: translate
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          # Diff exactly what this push changed. On a non-push trigger
          # (workflow_dispatch) or a brand-new branch's first push (where
          # `before` is the all-zeros SHA), the script's own git-diff error
          # handling falls back to `HEAD^...HEAD` or, failing that, a full
          # content rescan — see scripts/translate-content.mjs.
          GIT_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          GIT_HEAD_SHA: ${{ github.sha }}
        run: node --experimental-strip-types scripts/translate-content.mjs

      - name: Open pull request with the draft translations
        if: steps.translate.outputs.files_changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Default GITHUB_TOKEN — no separate PAT needed; `permissions`
          # above already grants it `contents: write` + `pull-requests: write`.
          commit-message: "Translate content to ES/FR (DeepL draft)"
          # `staging` is the long-lived branch that carries the stable Vercel
          # alias (docs/tina-setup.md section 7), so the PR head is that
          # branch rather than a per-run one.
          branch: staging
          title: "Translate content to ES/FR (DeepL draft — needs review)"
          body: |
            Automated draft translation, opened by `.github/workflows/translate-content.yml`
            after a push changed EN source content. **Nothing here is published** —
            this PR must be reviewed (and, if needed, corrected) before merging.

            See `docs/translation-workflow.md` for the full trigger → translate →
            PR → review → merge flow, what gets sent to DeepL vs. skipped, and
            how to check the translations in a live Tina Visual Editing preview
            before approving.

            Files changed in this run:
            ```
            ${{ steps.translate.outputs.file_list }}
            ```
          add-paths: content/**
          labels: translation,automated
          # Must stay false: `staging` is permanent (it owns the Vercel alias
          # and the Google OAuth redirect URI). `true` would make the action
          # delete it on any run that finds no changes and no open PR.
          delete-branch: false
